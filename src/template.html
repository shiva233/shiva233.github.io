<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Shiva Prakash — Electrical Engineer</title>
  <meta name="description" content="Shiva Prakash — Electrical Engineer. Résumé and contact links.">
  <meta property="og:title" content="Shiva Prakash — Electrical Engineer">
  <meta property="og:description" content="Hi! Nice to meet you. Find my résumé and get in touch.">
  <meta property="og:type" content="website"><meta property="og:image" content="assets/pcb-final.webp?v=3">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/ibm-plex-mono-400.ttf" as="font" type="font/ttf" crossorigin>
  <script>document.documentElement.classList.add('js')</script>
  <link rel="stylesheet" href="styles.css?v=5">
  <script src="image-animation.js?v=1" defer></script><script src="app.js?v=5" defer></script>
</head>
<body>
<button class="skip-link" type="button">Skip animation to contact links</button>
<main class="intro" aria-label="Shiva Prakash’s business card">
  <div class="intro-stage">
    <div class="card-media">
      <video id="pcb-video" src="assets/pcb-reveal.mp4?v=3" muted playsinline preload="auto" poster="assets/pcb-start.webp" disablepictureinpicture aria-label="Shiva’s PCB business card assembling from copper traces to silkscreen and components"></video>
      <video id="pcb-idle" src="assets/pcb-idle.mp4?v=3" muted playsinline loop preload="none" disablepictureinpicture aria-hidden="true"></video>
      <img class="card-still" src="assets/pcb-final.webp?v=3" alt="Shiva Prakash’s PCB business card, Electrical Engineer" width="1920" height="1080" fetchpriority="low">
      <img class="pcb-image-animation" id="pcb-image-animation" alt="" width="960" height="540" hidden aria-hidden="true">
      <img class="pcb-image-animation" id="pcb-idle-image" alt="" width="960" height="540" hidden aria-hidden="true">
    </div>
    <div class="hero-controls" tabindex="-1">
      <h1>Hi! Nice to meet you</h1>
      <div class="contact">
        <a class="email-link" href="mailto:{{EMAIL}}">{{EMAIL}} <span aria-hidden="true">↗</span></a>
        <nav class="contact-links" aria-label="Résumé and social profiles">
          <a class="resume-button" href="{{RESUME}}" target="_blank" rel="noopener noreferrer">View résumé <span aria-hidden="true">↗</span></a>
          <div class="social-links">
            <a href="{{LINKEDIN}}" target="_blank" rel="noopener noreferrer">LinkedIn <span aria-hidden="true">↗</span></a>
            <a href="{{X}}" target="_blank" rel="noopener noreferrer">X <span aria-hidden="true">↗</span></a>
            <a href="{{GITHUB}}" target="_blank" rel="noopener noreferrer">GitHub <span aria-hidden="true">↗</span></a>
          </div>
        </nav>
        <button id="play-animation" type="button">Replay animation <span aria-hidden="true">↻</span></button>
      </div>
      <footer><a href="https://github.com/hridaya423/silkreel" target="_blank" rel="noopener noreferrer">Opening animation built with Silkreel <span aria-hidden="true">↗</span></a></footer>
    </div>
    <button id="start-animation" class="start-animation" type="button" hidden>Play animation <span aria-hidden="true">▷</span></button>
  </div>
</main>
</body>
</html>
